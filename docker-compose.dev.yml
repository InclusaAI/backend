# version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: inclusaai-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: inclusaai
    ports:
      # Host port 5440, deliberately clear of 5432/5433 where native Postgres
      # installs commonly sit. Two servers competing for a port makes which
      # one you actually reach non-deterministic, and the failure looks like
      # a wrong password. Inside the compose network it is still 5432.
      - '5440:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates synapgrid-identity / -sessions / -preferences on first start.
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d inclusaai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: inclusaai-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: inclusaai-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: inclusaai-kafka
    depends_on:
      - zookeeper
    # When the stack restarts together (e.g. Docker Desktop restarts), Zookeeper
    # still holds the previous broker's registration until its session expires
    # (~18s), and a broker that starts sooner exits with NodeExists. Restarting
    # on failure lets it come up once that stale registration has gone.
    restart: on-failure
    ports:
      - '29092:29092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Fallback only: kafka-init below provisions every contract topic
      # explicitly. Relying on auto-creation alone means the first publish to
      # a topic waits out a leader election, and a producer still retrying
      # through it can outlive app shutdown.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # One-shot: creates every topic defined in libs/kafka-contracts, then exits.
  # Add new topics here when you add them to the contracts.
  kafka-init:
    image: confluentinc/cp-kafka:7.3.0
    container_name: inclusaai-kafka-init
    depends_on:
      - kafka
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    # 1 partition matches what auto-creation produced before. Raising it on
    # accessibility.preference.updated first needs messages keyed by userId,
    # or updates for one participant can be consumed out of order.
    command:
      - |
        # Bounded, so a broker that never comes up shows as Exited (1) rather
        # than this container sitting at "Up" looking healthy.
        for attempt in $$(seq 1 60); do
          kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1 && break
          if [ "$$attempt" -eq 60 ]; then
            echo "kafka not reachable after 2 minutes: check 'docker logs inclusaai-kafka'"
            exit 1
          fi
          echo "waiting for kafka..."; sleep 2
        done
        for topic in \
          identity.invitation.created \
          session.created \
          session.updated \
          session.ended \
          accessibility.preference.updated; do
          kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 1 --replication-factor 1
        done
        echo "kafka topics ready"

volumes:
  postgres-data:
  redis-data: