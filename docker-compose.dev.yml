# Local development infrastructure for the InclusaAI platform.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# This is the CANONICAL infrastructure stack. All repos should connect
# to these services — do NOT define your own Kafka/Redis/Postgres.
#
# Ports:
#   Postgres:  5432  (backend services)
#   Redis:     6379  (LiveKit, sessions)
#   Redpanda:  9092  (Kafka-compatible broker)
#   Redpanda:  9644  (admin API)
name: inclusaai-dev

services:
  # ---- PostgreSQL (session-service, preference-service) ----
  postgres:
    image: postgres:15
    container_name: inclusaai-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: inclusaai
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d inclusaai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis (LiveKit signaling, session state) ----
  redis:
    image: redis:7-alpine
    container_name: inclusaai-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Kafka API (Redpanda — speaks the Kafka protocol, no ZooKeeper) ----
  # ai-services and realtime-media-backend connect to this broker.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: inclusaai-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - '9092:9092'     # host clients (KAFKA_BROKER=localhost:9092)
      - '9644:9644'     # admin API / cluster health
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data: