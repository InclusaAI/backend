# Render Blueprint for the InclusaAI platform backend.
#
# Deploy: Render Dashboard → New → Blueprint → point at this repo/branch.
#
# Pinned to the FREE compute plan for the initial deployment. The tradeoffs:
#   - All four web services share 750 free instance-hours per month and spin
#     down after 15 minutes idle (~1 min cold start; WebSocket clients drop and
#     the Kafka consumers disconnect until the next request wakes them).
#   - Free services cannot RECEIVE private-network traffic, so session-service
#     calls preference-service over its public URL instead of hostport.
#   - Free web services do NOT support `preDeployCommand`, so migrations run
#     from the image entrypoint (docker/entrypoint.sh) before the process
#     starts. That works on both free and paid plans.
#   - Render's free Postgres expires 30 days after creation, so the database is
#     an external Neon Postgres instead of a Render-managed one. All three
#     database services share that single database. Each service still runs its
#     own `prisma migrate deploy` against its own migrations directory; the
#     additive init migrations coexist in the shared `_prisma_migrations`
#     table. Do NOT use `db push` here: it would drop the other services'
#     tables.
# Going paid: change the plans below and, if you give each service its own
# database, point DATABASE_URL at it. Migrations stay in the entrypoint.
#
# What you get:
#   identity-service    accounts, orgs, invitations. Issues the account token.
#   session-service     presentations, sessions, participants, participant tokens
#   preference-service  per-participant accessibility settings (participant token)
#   fanout-service      live captions over WebSocket (Redis + Kafka, no database)
#   inclusaai-redis     fanout's participant state and socket.io adapter
#   Neon Postgres       one shared database for identity/session/preference
#                       (ADR-0003 wants one per service: do that once paid,
#                       because no shared database and no cross-service FKs)
#
# What Render does NOT provide, and this file therefore does not invent:
#   - Kafka. The broker is the Aiven instance ai-services already uses, so both
#     repos share one event bus. Only the password is `sync: false` — set it in
#     the dashboard at creation (see docs/RENDER.md).
#   - presenter-assist-service, which is a post-MVP scaffold with no endpoints.
#
# Every service builds from its own Dockerfile with the repository root as
# context, because each app resolves the pnpm workspace in libs/*.

services:
  # ---------------------------------------------------------------------------
  # identity-service — issues the JWT every other service verifies
  # ---------------------------------------------------------------------------
  - type: web
    name: identity-service
    runtime: docker
    dockerfilePath: ./apps/identity-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    # No preDeployCommand: Render does not offer one on free web services.
    # The container entrypoint runs `prisma migrate deploy` before the app
    # starts (docker/entrypoint.sh), so the schema is ready either way.
    envVars:
      - fromGroup: backend-shared
      # DATABASE_URL lives in its own group so it is prompted once at
      # blueprint creation and shared by every Prisma service.
      - fromGroup: backend-database

  # ---------------------------------------------------------------------------
  # session-service — issues participant tokens, tracks the live roster
  # ---------------------------------------------------------------------------
  - type: web
    name: session-service
    runtime: docker
    dockerfilePath: ./apps/session-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - fromGroup: backend-shared
      # DATABASE_URL lives in its own group so it is prompted once at
      # blueprint creation and shared by every Prisma service.
      - fromGroup: backend-database
      # Free services cannot receive private-network traffic, so on the free
      # plan this is preference-service's public URL. `RENDER_EXTERNAL_URL` is
      # Render's built-in `https://<service>.onrender.com` value; `property:
      # url` is not a valid Blueprint property and fails validation.
      # Once preference-service is on a paid plan, switch to
      # PREFERENCE_SERVICE_HOST with `property: hostport` (session-service
      # already understands both forms).
      - key: PREFERENCE_SERVICE_URL
        fromService:
          name: preference-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # ---------------------------------------------------------------------------
  # preference-service — per-participant accessibility settings
  # ---------------------------------------------------------------------------
  - type: web
    name: preference-service
    runtime: docker
    dockerfilePath: ./apps/preference-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - fromGroup: backend-shared
      # DATABASE_URL lives in its own group so it is prompted once at
      # blueprint creation and shared by every Prisma service.
      - fromGroup: backend-database

  # ---------------------------------------------------------------------------
  # fanout-service — WebSocket captions. No database.
  # ---------------------------------------------------------------------------
  - type: web
    name: fanout-service
    runtime: docker
    dockerfilePath: ./apps/fanout-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - fromGroup: backend-shared
      - key: REDIS_URL
        fromService:
          name: inclusaai-redis
          type: keyvalue
          property: connectionString
      # The free Key Value plan has only 25 MB. The stream holds every
      # socket.io broadcast (captions included), so cap it well below that:
      # 10k entries is a few MB and still covers far more than the 2-minute
      # reconnection window at MVP traffic. Raise it on a paid Key Value plan.
      - key: FANOUT_STREAM_MAXLEN
        value: "10000"

  # ---------------------------------------------------------------------------
  # Key Value (Redis) — fanout only: participant state plus the socket.io
  # streams adapter that makes several instances behave as one and enables
  # reconnection.
  # ---------------------------------------------------------------------------
  # Only one free Key Value per workspace, which is all this needs. Free
  # instances are in-memory only (25 MB max): participant state and the
  # socket.io adapter data are lost on every restart or spin-down, which is why
  # FANOUT_STREAM_MAXLEN above is sized for the small free instance.
  - type: keyvalue
    name: inclusaai-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: [] # internal (private-network) connections only

# No `databases:` block on purpose.
# Render's free Postgres expires 30 days after creation, so the database is an
# external Neon Postgres instead (see the backend-database group below). Per
# ADR-0003 each service should own its own database; the free deployment shares
# one because Neon's free tier is a single database. Migrations still run per
# service with `prisma migrate deploy` from the image entrypoint, each applying
# only its own migrations/ folder, so the additive init migrations coexist in
# the shared `_prisma_migrations` table. `db push` must NOT be used: it syncs
# the whole database to one service's schema and would drop the others' tables.
# On paid plans, create one database per service (identity-db, sessions-db,
# preferences-db / synapgrid-identity, synapgrid-sessions,
# synapgrid-preferences) and point each service's DATABASE_URL at it. No other
# change is needed.

envVarGroups:
  - name: backend-shared
    envVars:
      - key: NODE_ENV
        value: production

      # --- Kafka -------------------------------------------------------------
      # Same broker as ai-services (Aiven), so one event bus serves both repos.
      # The variable names are the ones ai-services already uses.
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: kafka-9780174-imkargi-90f4.l.aivencloud.com:27345
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: plain
      - key: KAFKA_USERNAME
        value: avnadmin
      - key: KAFKA_PASSWORD
        sync: false
      # Aiven signs with a private CA that is not in the system trust store. The
      # Dockerfiles copy certs/ into the image, so this is a path, not contents.
      - key: KAFKA_CA_CERT
        value: /usr/src/app/certs/aiven-kafka-ca.pem

      # --- Secrets -----------------------------------------------------------
      # Generated once for the group, so every service that reads it gets the
      # same value — which is the requirement: JWT_SECRET must be identical
      # wherever account tokens are verified, and PARTICIPANT_TOKEN_SECRET
      # identical in session/preference/fanout. Generate your own and set them
      # with `sync: false` instead if you need to control the values.
      # PARTICIPANT_TOKEN_SECRET is deliberately a different secret from
      # JWT_SECRET: that separation is what stops a participant token acting as
      # an account token and vice versa.
      - key: JWT_SECRET
        generateValue: true
      - key: PARTICIPANT_TOKEN_SECRET
        generateValue: true

      # --- Browser access ----------------------------------------------------
      # Comma-separated frontend origins. Without the real domains browsers are
      # blocked even though curl works.
      - key: CORS_ORIGINS
        sync: false

  # ---------------------------------------------------------------------------
  # Shared database credentials. Separate from backend-shared because only the
  # three Prisma services read them.
  # ---------------------------------------------------------------------------
  - name: backend-database
    envVars:
      # Paste Neon's DIRECT connection string, not the "-pooler" one, and point
      # it at a database that belongs to this app:
      #   postgresql://<user>:<password>@ep-xxx.<region>.aws.neon.tech/inclusaai?sslmode=require
      # Do NOT reuse a database that already has tables: `prisma migrate deploy`
      # refuses a non-empty schema (error P3005) to avoid clobbering data. Neon's
      # default `neondb` usually already holds other apps' tables, so create a
      # dedicated database first (console: Databases -> New Database).
      # The entrypoint runs `prisma migrate deploy` over this same URL, and
      # Prisma Migrate holds a session-level advisory lock that PgBouncer
      # (Neon's pooled endpoint) cannot guarantee across transactions. If you
      # want pooling later, keep this direct URL as `directUrl` in each Prisma
      # schema and give the runtime a separate pooled URL with `?pgbouncer=true`.
      - key: DATABASE_URL
        sync: false
